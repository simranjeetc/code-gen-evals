[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codegen-evals"
version = "0.1.0"
description = "Four-dimension eval framework for code-generation model quality"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Simranjeet Singh" }]
keywords = ["code-generation", "evaluation", "llm", "benchmark", "model-evaluation", "pytest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/simranjeetc/code-gen-evals"
Repository = "https://github.com/simranjeetc/code-gen-evals"
Issues = "https://github.com/simranjeetc/code-gen-evals/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
codegen-evals = "codegen_evals.cli:main"

[tool.setuptools]
packages = ["codegen_evals", "codegen_evals.providers", "codegen_evals.scoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
